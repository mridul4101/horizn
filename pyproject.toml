[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizn"
version = "0.1.0"
description = "Locally-hosted macOS service for creating and publishing Instagram landscape carousels from Apple Photos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web framework & server
    "fastapi>=0.115",
    "uvicorn[standard]",
    # Configuration
    "python-dotenv",
    "pydantic-settings",
    # Apple Photos access
    "osxphotos>=0.68",
    # Apple Vision / CoreML bindings (macOS only)
    "pyobjc-framework-Vision>=10.0",
    "pyobjc-framework-CoreML>=10.0",
    # Image processing
    "Pillow>=10.0",
    "pillow-heif>=0.16.0",
    "opencv-python-headless>=4.9",
    # Deduplication
    "imagehash>=4.3",
    # Clustering
    "scikit-learn>=1.4",
    # Gemini SDK
    "google-genai>=1.0",
    # HTTP client
    "httpx>=0.27",
    # Async SQLite
    "aiosqlite>=0.20",
    # CLI output
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["horizn*"]
